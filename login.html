
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | CINEVA</title>
    <meta name="description" content="Sign in or create your CINEVA account to enjoy your entertainment experience.">

    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/contact-widget.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="auth-background">
        <div class="auth-glow glow-one"></div>
        <div class="auth-glow glow-two"></div>
        <div class="auth-grid"></div>
    </div>

    <header class="auth-header">
        <a href="/" class="auth-logo">
            CINE<span>VA</span><i class="fa-solid fa-play"></i>
        </a>

       <a href="/" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Home</span>
        </a>
    </header>

    <main class="auth-main">

        <section class="auth-card">

            <div class="auth-brand-icon">
                <i class="fa-solid fa-film"></i>
            </div>

            <div class="auth-heading">
                <span class="auth-eyebrow">YOUR ENTERTAINMENT WORLD</span>
                <h1 id="auth-title">Welcome Back</h1>
                <p id="auth-description">
                    Sign in to continue your CINEVA experience.
                </p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="signin-tab">
                    Sign In
                </button>

                <button type="button" class="auth-tab" id="signup-tab">
                    Create Account
                </button>

                <span class="auth-tab-indicator"></span>
            </div>

            <form id="auth-form" novalidate>

                <div class="form-group" id="name-group" hidden>
                    <label for="full-name">Full Name</label>

                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>

                        <input
                            type="text"
                            id="full-name"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="password-toggle"
                            aria-label="Show password"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group" id="confirm-password-group" hidden>
                    <label for="confirm-password">Confirm Password</label>

                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved input-icon"></i>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                        >
                    </div>
                </div>

                <div class="form-options" id="signin-options">
                    <label class="remember-option">
                        <input type="checkbox" id="remember-me">
                        <span>Remember me</span>
                    </label>

                    <button type="button" id="forgot-password" class="forgot-link">
                        Forgot password?
                    </button>
                </div>

                <div class="auth-message" id="auth-message" role="status" aria-live="polite" hidden>
                    <i class="fa-solid fa-circle-info"></i>
                    <span id="auth-message-text"></span>
                </div>

                <button type="submit" class="auth-submit" id="auth-submit">
                    <span id="submit-text">Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="auth-divider">
                <span>SECURE AUTHENTICATION</span>
            </div>

            <p class="auth-terms">
                By continuing, you agree to CINEVA's
                <a href="#">Terms of Service</a> and
                <a href="#">Privacy Policy</a>.
            </p>

            <div class="auth-bottom">
                <span id="bottom-text">Don't have an account?</span>

                <button type="button" id="bottom-toggle">
                    Create one
                </button>
            </div>

        </section>

        <div class="auth-footer">
            <span>© <span id="auth-year"></span> CINEVA.</span>
            <span>Entertainment without limits.</span>
        </div>

    </main>

    <script>
        document.getElementById("auth-year").textContent =
            new Date().getFullYear();
    </script>

    <script type="module" src="js/login.js"></script>
    <script src="js/contact-widget.js"></script>

</body>
</html>
